<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="./styles/styles.css">

    <title>Green Earth</title>


</head>

<body>


    <main class="container mx-auto text-center mb-20">
        <h2 class="text-[#1F2937] font-bold text-3xl my-10">Choose Your Tress</h2>


        <div class="main-div grid grid-cols-12 gap-8">

            <!-- Categories container (left side)-->

            <div class="font-bold bg-white  card-body shadow rounded-md text-2xl col-span-3">
                <h2 class="font-bold text-2xl text-left m-2">Categories</h2>

                <div class="space-y-3">
                    <button id="all-trees" class="btn btn-primary w-full">All Trees</button>

                    <!-- Small spinner for categories -->
                    <div id="category-spinner" class="flex justify-center items-center py-10 hidden">
                        <span class="loading loading-dots loading-md"></span>

                    </div>

                    <div id="categoriesContainer" class="space-y-3">
                        <!-- categories will be dynamically load here by JS -->
                    </div>

                </div>
            </div>


            <!-- Cards  (center)-->
            <div class="rounded-xl col-span-6">

                <!-- Loading Spinner -->
                <div id="loading-spinner" class="h-[60vh] flex justify-center items-center hidden">
                    <span class="loading loading-dots loading-xl"></span>
                </div>


                <!-- Trees will rendered -->
                <div id="treesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <!-- dynamically added here -->

                </div>



            </div>


            <!-- cart (right side) -->
            <div class="bg-white col-span-3 rounded-md shadow-sm">
                <h2 class="my-10">Cart here....</h2>
            </div>

        </div>
    </main>








    <script src="script/script.js"></script>
    <!-- <script src="script/exercise.js"></script> -->
</body>

</html>
